name: API Test Automation

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    # ✅ Global environment variables for the job
    env:
      ENV: qa
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17 with Maven cachename: API Test Automation

on:
  push:
    branches:
      - "**"

  repository_dispatch:
    types:
      - run-tests

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: qa
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Setup Java
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # =========================
      # 3. Validate secret
      # =========================
      - name: Check GOREST_TOKEN
        run: |
          if [ -z "${{ secrets.GOREST_TOKEN }}" ]; then
            echo "GOREST_TOKEN is missing!"
            exit 1
          else
            echo "GOREST_TOKEN is present"
          fi

      # =========================
      # 4. Show trigger payload (debug)
      # =========================
      - name: Print repository_dispatch payload
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Event payload:"
          echo '${{ toJson(github.event.client_payload) }}'

      # =========================
      # 5. Run API Tests
      # =========================
      - name: Run API tests
        run: |
          mvn clean test verify \
            -Dallure.results.directory=target/allure-results \
            -Dmaven.test.failure.ignore=true

      # =========================
      # 6. Validate results
      # =========================
      - name: Check Allure results
        run: |
          echo "Allure results files:"
          find target/allure-results -type f || true

      # =========================
      # 7. Generate Allure report
      # =========================
      - name: Generate Allure report
        run: |
          mvn allure:report \
            -Dallure.results.directory=target/allure-results \
            -Dallure.report.directory=target/allure-report

      # =========================
      # 8. Validate report
      # =========================
      - name: List Allure report
        run: |
          ls -R target/allure-report || true

      # =========================
      # 9. Upload report artifact
      # =========================
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3️⃣ Debug: check GOREST_TOKEN
      - name: Check GOREST_TOKEN
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          if [ -z "$GOREST_TOKEN" ]; then
            echo "GOREST_TOKEN is missing!"
            exit 1
          else
            echo "GOREST_TOKEN length: ${#GOREST_TOKEN}"
          fi

      # 4️⃣ Run tests (ignore failures so Allure collects all results)
      - name: Run tests
        run: |
          mvn clean test verify \
            -Dallure.results.directory=target/allure-results \
            -Dmaven.test.failure.ignore=true

      # 5️⃣ Debug: list Allure results
      - name: Check Allure results content
        run: |
          echo "Allure results files:"
          find target/allure-results -type f -exec ls -lh {} \;

      # 6️⃣ Generate Allure HTML report via Maven plugin
      - name: Generate Allure HTML report
        run: |
          mvn allure:report \
            -Dallure.results.directory=target/allure-results \
            -Dallure.report.directory=target/allure-report

      # 7️⃣ Debug: list report contents
      - name: List Allure report folder
        run: |
          ls -R target/allure-report
          echo "Number of JSON files in data:"
          find target/allure-report/data -name "*.json" | wc -l

      # 8️⃣ Upload Allure report as artifact
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report